<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COSMETIC — 我的收藏</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo"><div class="logo-mark">💄</div>COSMETIC</a>
    <nav class="nav">
      <a href="index.html" class="nav-link">首頁</a>
      <a href="products.html" class="nav-link active">產品</a>
      <a href="ai.html" class="nav-link">AI 檢測</a>
      <a href="video.html" class="nav-link">影片交流</a>
    </nav>
    <div class="header-actions">
      <a href="favorite.html" class="icon-btn" style="color:var(--rose);">♥<span class="count">3</span></a>
      <a href="compare.html" class="icon-btn">⚖</a>
      <a href="profile.html" class="user-chip"><div class="user-avatar">A</div><span>alice</span></a>
    </div>
  </div>
</header>

<main style="max-width:var(--max-w);margin:40px auto 80px;padding:0 24px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;">
    <div>
      <h1 style="font-size:1.4rem;margin-bottom:4px;">我的收藏</h1>
      <p style="font-size:13px;color:var(--text-3);">已收藏 3 個產品</p>
    </div>
    <a href="products.html" class="btn btn-outline btn-sm">繼續瀏覽</a>
  </div>

  <div class="product-grid">
    <div class="product-card">
      <div class="product-card-img">🌸</div>
      <button class="fav-btn active" title="取消收藏">♥</button>
      <div class="product-card-body">
        <div class="product-card-brand">NARS</div>
        <div class="product-card-name">裸光蜜粉餅 Radiant Pressed</div>
        <span class="badge badge-rose">底妝</span>
        <div class="product-card-actions">
          <a href="product-detail.html" class="btn btn-primary">查看</a>
          <button class="btn btn-outline">比較</button>
        </div>
      </div>
    </div>
    <div class="product-card">
      <div class="product-card-img">✨</div>
      <button class="fav-btn active" title="取消收藏">♥</button>
      <div class="product-card-body">
        <div class="product-card-brand">Dior</div>
        <div class="product-card-name">迪奧超完美柔霧唇膏</div>
        <span class="badge badge-rose">唇膏</span>
        <div class="product-card-actions">
          <a href="product-detail.html" class="btn btn-primary">查看</a>
          <button class="btn btn-outline">比較</button>
        </div>
      </div>
    </div>
    <div class="product-card">
      <div class="product-card-img">🎨</div>
      <button class="fav-btn active" title="取消收藏">♥</button>
      <div class="product-card-body">
        <div class="product-card-brand">3CE</div>
        <div class="product-card-name">Multi Eye Color Palette</div>
        <span class="badge badge-rose">眼影</span>
        <div class="product-card-actions">
          <a href="product-detail.html" class="btn btn-primary">查看</a>
          <button class="btn btn-outline">比較</button>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="footer"><p>© 2025 COSMETIC</p></footer>
</body>
</html>
