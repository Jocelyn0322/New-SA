<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COSMETIC — 產品比較</title>
<link rel="stylesheet" href="shared.css">
<style>
.compare-wrap { max-width: var(--max-w); margin: 40px auto 80px; padding: 0 24px; }
.compare-table-wrap { overflow-x: auto; border-radius: var(--r-xl); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.compare-table { width: 100%; border-collapse: collapse; background: var(--card); }
.compare-table td, .compare-table th { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: top; }
.compare-table tr:last-child td { border-bottom: none; }
.compare-table .row-label { background: #fafafa; font-size: 12px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; width: 140px; min-width: 140px; vertical-align: middle; }
.compare-product-header { text-align: center; }
.compare-product-img { width: 80px; height: 80px; border-radius: var(--r); background: var(--rose-50); display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 10px; }
.compare-product-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.compare-product-brand { font-size: 12px; color: var(--text-3); font-weight: 500; text-transform: uppercase; }
.compare-remove { margin-top: 10px; }
.stars-sm { display: flex; gap: 2px; justify-content: center; }
.star-sm { font-size: 14px; color: #e5e7eb; }
.star-sm.filled { color: #f59e0b; }
.compare-score { font-size: 18px; font-weight: 700; text-align: center; }
.compare-add-col { text-align: center; vertical-align: middle !important; }
.add-col-placeholder { width: 200px; min-width: 200px; }
.add-product-btn { border: 2px dashed var(--rose-200); border-radius: var(--r-lg); padding: 24px 16px; text-align: center; cursor: pointer; transition: all var(--t); background: var(--rose-50); }
.add-product-btn:hover { border-color: var(--rose); background: var(--rose-100); }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo"><div class="logo-mark">💄</div>COSMETIC</a>
    <nav class="nav">
      <a href="index.html" class="nav-link">首頁</a>
      <a href="products.html" class="nav-link active">產品</a>
      <a href="ai.html" class="nav-link">AI 檢測</a>
      <a href="video.html" class="nav-link">影片交流</a>
    </nav>
    <div class="header-actions">
      <a href="favorite.html" class="icon-btn">♡<span class="count">3</span></a>
      <a href="compare.html" class="icon-btn" style="color:var(--rose);">⚖</a>
      <a href="profile.html" class="user-chip"><div class="user-avatar">A</div><span>alice</span></a>
    </div>
  </div>
</header>

<div class="compare-wrap">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
    <div>
      <h1 style="font-size:1.4rem;margin-bottom:4px;">產品比較</h1>
      <p style="font-size:13px;color:var(--text-3);">最多可同時比較 4 項產品</p>
    </div>
    <a href="products.html" class="btn btn-outline btn-sm">← 繼續選購</a>
  </div>

  <div class="compare-table-wrap">
    <table class="compare-table">
      <!-- Header Row -->
      <tr>
        <td class="row-label"></td>
        <!-- Product 1 -->
        <td class="compare-product-header">
          <div class="compare-product-img">🌸</div>
          <div class="compare-product-name">NARS 裸光蜜粉餅</div>
          <div class="compare-product-brand">NARS</div>
          <div class="compare-remove"><button class="btn btn-outline btn-sm" onclick="this.closest('td').style.display='none'">移除</button></div>
        </td>
        <!-- Product 2 -->
        <td class="compare-product-header">
          <div class="compare-product-img">💋</div>
          <div class="compare-product-name">MAC Ruby Woo 唇膏</div>
          <div class="compare-product-brand">MAC</div>
          <div class="compare-remove"><button class="btn btn-outline btn-sm">移除</button></div>
        </td>
        <!-- Add Col -->
        <td class="compare-add-col add-col-placeholder">
          <div class="add-product-btn" onclick="window.location.href='products.html'">
            <div style="font-size:28px;margin-bottom:8px;">＋</div>
            <div style="font-size:13px;font-weight:600;color:var(--rose);">新增比較產品</div>
          </div>
        </td>
      </tr>
      <!-- Brand -->
      <tr>
        <td class="row-label">品牌</td>
        <td style="text-align:center;">NARS</td>
        <td style="text-align:center;">MAC</td>
        <td class="compare-add-col"></td>
      </tr>
      <!-- Category -->
      <tr>
        <td class="row-label">分類</td>
        <td style="text-align:center;"><span class="badge badge-rose">底妝</span></td>
        <td style="text-align:center;"><span class="badge badge-rose">口紅</span></td>
        <td class="compare-add-col"></td>
      </tr>
      <!-- Origin -->
      <tr>
        <td class="row-label">產地</td>
        <td style="text-align:center;">日本</td>
        <td style="text-align:center;">加拿大</td>
        <td class="compare-add-col"></td>
      </tr>
      <!-- Rating -->
      <tr>
        <td class="row-label">控油力</td>
        <td style="text-align:center;">
          <div class="stars-sm"><span class="star-sm filled">★</span><span class="star-sm filled">★</span><span class="star-sm filled">★</span><span class="star-sm filled">★</span><span class="star-sm">★</span></div>
          <div class="compare-score" style="color:var(--rose);">4.0</div>
        </td>
        <td style="text-align:center;">
          <div class="stars-sm"><span class="star-sm filled">★</span><span class="star-sm filled">★</span><span class="star-sm filled">★</span><span class="star-sm">★</span><span class="star-sm">★</span></div>
          <div class="compare-score" style="color:var(--text-2);">3.2</div>
        </td>
        <td class="compare-add-col"></td>
      </tr>
      <tr>
        <td class="row-label">延展性</td>
        <td style="text-align:center;">
          <div class="stars-sm"><span class="star-sm filled">★</span><span class="star-sm filled">★</span><span class="star-sm filled">★</span><span class="star-sm filled">★</span><span class="star-sm filled">★</span></div>
          <div class="compare-score" style="color:var(--rose);">4.8</div>
        </td>
        <td style="text-align:center;">—</td>
        <td class="compare-add-col"></td>
      </tr>
      <tr>
        <td class="row-label">持久度</td>
        <td style="text-align:center;">
          <div class="stars-sm"><span class="star-sm filled">★</span><span class="star-sm filled">★</span><span class="star-sm filled">★</span><span class="star-sm">★</span><span class="star-sm">★</span></div>
          <div class="compare-score" style="color:var(--text-2);">3.2</div>
        </td>
        <td style="text-align:center;">
          <div class="stars-sm"><span class="star-sm filled">★</span><span class="star-sm filled">★</span><span class="star-sm filled">★</span><span class="star-sm filled">★</span><span class="star-sm filled">★</span></div>
          <div class="compare-score" style="color:var(--rose);">4.9</div>
        </td>
        <td class="compare-add-col"></td>
      </tr>
      <!-- Purpose -->
      <tr>
        <td class="row-label">用途</td>
        <td>提亮膚色，打造自然光澤感，輕盈裸光質地。</td>
        <td>經典正紅色，高顯色度，超強持色力，不掉色。</td>
        <td class="compare-add-col"></td>
      </tr>
      <!-- Actions -->
      <tr>
        <td class="row-label"></td>
        <td style="text-align:center;"><a href="product-detail.html" class="btn btn-primary btn-sm">查看詳情</a></td>
        <td style="text-align:center;"><a href="product-detail.html" class="btn btn-primary btn-sm">查看詳情</a></td>
        <td class="compare-add-col"></td>
      </tr>
    </table>
  </div>
</div>

<footer class="footer"><p>© 2025 COSMETIC</p></footer>
</body>
</html>
